<div class="teacher-portal-layout">
  <!-- ================= TOP HEADER (NAVBAR) ================= -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <!-- Brand Logo -->
        <a routerLink="/report" class="brand-logo">
          <div class="logo-box">S</div>
          <span class="logo-text">SmartTutor<span class="logo-pro">Pro</span></span>
        </a>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
          <a 
            routerLink="/report" 
            routerLinkActive="active"
            class="tab-btn">
            Báo cáo & Thu phí (Live)
          </a>

          <a 
            routerLink="/classes" 
            routerLinkActive="active"
            class="tab-btn">
            <span>Lớp Học (10-20 HS)</span>
            <span class="badge-new">Mới</span>
          </a>

          <a 
            routerLink="/schedule" 
            routerLinkActive="active"
            class="tab-btn">
            Lịch dạy & Ca học
          </a>

          <a 
            routerLink="/students" 
            routerLinkActive="active"
            class="tab-btn">
            Học sinh (Cá nhân)
          </a>
        </nav>
      </div>

      <!-- User Profile & Quick Actions -->
      <div class="header-right">
        <span class="pill-today">
          <span class="pulse-emerald"></span> 2 ca hôm nay
        </span>
        <div class="header-divider"></div>
        
        <div class="user-profile">
          <div class="avatar-circle">{{ teacherInitials }}</div>
          <div class="user-meta">
            <div class="user-name">{{ teacherName }}</div>
            <div class="user-bank">{{ teacherBank }}</div>
          </div>
        </div>

        <button type="button" class="btn-logout" (click)="logout()" title="Đăng xuất">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= NỘI DUNG CHÍNH (ROUTER OUTLET) ================= -->
  <main class="main-body">
    <router-outlet></router-outlet>
  </main>
</div>
